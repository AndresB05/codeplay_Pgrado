schema: spec-driven

# Contexto del proyecto. OpenSpec lo muestra a la IA al crear artefactos, así
# que se mantiene corto a propósito: el detalle largo vive en docs/CONTEXT.md.
context: |
  CodePlay es una plataforma web para enseñar pensamiento computacional a niños.
  Es un proyecto de grado. Consta de tres piezas: un front-end en React, un
  backend en Supabase y un juego 3D en el navegador. NO es Unity: el
  3-sep-2026 se descartó en favor de librerías de JavaScript, así que el juego
  será parte de la propia aplicación web. Ver docs/DISENO-DEL-JUEGO.md.

  ESTADO ACTUAL (verificado el 29-ago-2026)
  El esquema de Supabase está APLICADO en un proyecto real: tablas, RPC, RLS y
  el contenido inicial de mundos y niveles, incluidas las cuatro tablas de
  salones y las dos vistas de lectura de la 0015, todo verificado con sesiones
  reales. LOS SALONES YA NO VIVEN EN localStorage: desde el paso 10 el store lee
  y escribe contra la base, con la identidad del usuario de la sesión. EL LOGIN
  Y EL REGISTRO YA SON REALES (paso 12): cada rol aterriza en su panel según el
  perfil que devuelve el servidor, un registro que no abre sesión pide confirmar
  el correo en vez de fallar mudo, y una sesión sin perfil no da acceso a ningún
  panel. El botón «Sin login» sigue existiendo sólo en desarrollo y autentica de
  verdad con las cuentas de prueba de apps/web/.env. LAS CONTRASEÑAS TAMBIÉN SON
  REALES (paso 13): se cambian desde Ajustes —pidiendo la actual y verificándola
  contra el servidor— y se recuperan por correo desde /forgot-password, con la
  pantalla /reset-password detrás de PrivateRoute sin rol. Las dos mitades se
  verificaron contra la base real. El paso 14 —consentimiento del acudiente y
  política de privacidad— está EXPLORADO y partido en dos cambios que dependen
  de una decisión pendiente del usuario (quién figura como responsable del
  tratamiento); de él ya salió `invitaciones-sin-correo`, que eliminó
  invitations.email en la migración 0016 porque guardaba el correo de un tercero
  sin cuenta, sin plazo y para un envío que no ocurre.
  GOOGLE OAUTH ES REAL (paso 15): el acceso con Google funciona por los dos
  caminos y EL ROL SE FIJA EN EL PRIMER REGISTRO Y NO CAMBIA NUNCA. La
  migracion 0018 anade profiles.is_role_declared y set_my_role rechaza si el
  rol ya se declaro (ZC001) o si el perfil tiene lazos de salon (ZC002).
  Verificado contra la base real, incluido el dano que lo motivo: un nino con
  membresia que acababa tutor y fuera de su salon.
  EL PASO 28 (`arreglos-y-barra-xp`) cerro tres fallos vivos y dio superficie al
  XP: la migracion 0019 acota el username derivado del correo a 3-30 tras
  normalizar y lo deja null si no encaja, de modo que un correo corto o largo ya
  no aborta el alta; auth.service.ts traduce los fallos de autenticacion por
  codigo con AUTH_ERROR_MESSAGES (createAppError.ts NO se toco, lo usan otros
  seis servicios); el panel dejo de inventar nombre, correo y racha en cinco
  archivos, con FALLBACK_STUDENT_NAME exportado desde classrooms.service.ts; y
  XPBar, retintada al tema de selva, se monta en la barra lateral, la barra
  superior y la tabla de seguimiento en sus dos vistas. El maximo provisional
  PROVISIONAL_MAX_XP YA NO EXISTE: lo retiro el J11.
  EL PASO 29 (`nombre-editable`) hizo el nombre editable desde Ajustes. La
  accion `updateFullName` vive en AuthProvider y hace setUser con lo que
  devuelve update_my_profile, de modo que las siete superficies que leen
  user.fullName se refrescan sin recargar; NO pasa por useProfile(), que
  mantiene su propia copia. El panel shared/ChangeNamePanel.tsx lo montan las
  dos pantallas de Ajustes. La longitud del nombre (2-60) se declara una sola
  vez en components/auth/fullName.schema.ts y la heredan el registro y Ajustes;
  la RPC no valida full_name en absoluto, asi que esa es la unica defensa (ver
  docs/CONTEXT.md 4.9). Cerro ademas lo que el paso 28 dejo fuera del panel del
  tutor: FALLBACK_TEACHER_NAME esta junto a FALLBACK_STUDENT_NAME en
  classrooms.service.ts y el correo inventado desaparecio. Sin migracion.
  EL PASO 16 (`misiones-asignadas`) persiste la asignacion de misiones. La
  migracion 0020 crea mission_assignments colgando del SALON (no del tutor: el
  nino se liga a un salon por su pertenencia, no a una persona), con
  unique (group_id, mission_key), politicas de select/insert/delete y sin
  update. mission_key es TEXTO SIN CLAVE AJENA a sabiendas: el catalogo son
  cinco entradas en teacher/classroomsData.ts y no hay tabla a la que apuntar,
  asi que el cliente ignora las claves que no reconoce. Va por
  services/missions.service.ts + hooks/useMissionAssignments.ts, SIN tocar
  ClassroomsProvider. El selector de alcance del panel dejo de ignorarse y ahora
  gobierna tambien la escritura. El nino ve solo lo asignado, en
  shared/AssignedMissionsPanel.tsx montado en Mundos y en Mi salon, y el panel
  NO se pinta si no hay nada que ensenar.
  LAS MISIONES TODAVIA NO SON JUGABLES: nada puede empezarlas ni completarlas
  hasta el paso 21, asi que la tarjeta del nino no ofrece ningun boton y el
  apartado de cumplimiento saca al salon entero en «Pendiente» con el motivo
  escrito encima. NO se creo tabla de cumplimientos a proposito: el estado se
  calcula, y decidir que reporta el juego es la pregunta abierta previa al paso
  20. El premio en XP vive en Mission.xpReward (300/400/500 por dificultad),
  por encima de los 260 del nivel mas generoso de la siembra; se muestra, pero
  nada lo suma todavia.
  EL PASO 18 (`sincronizacion-en-vivo`) da sincronizacion en vivo con Supabase
  Realtime, y NO son notificaciones: no hay campana, ni lista de avisos, ni no
  leidos, ni tabla que persista un aviso. Son tres pantallas que ya existian y
  ahora se actualizan solas —la bandeja del tutor, la pertenencia del nino y sus
  misiones—. La migracion 0021 anade join_requests, class_memberships y
  mission_assignments a la publicacion supabase_realtime, que ya existia con las
  cuatro operaciones activas y CERO tablas; no crea la publicacion ni toca sus
  operaciones, y no exige gen types porque publicar no cambia el esquema.
  LA SUSCRIPCION ENTRA POR EL SERVICIO, nunca por `supabase` dentro de un
  provider: subscribeToClassrooms() en classrooms.service.ts y
  subscribeToAssignments() en missions.service.ts, cada una devolviendo su
  cancelacion, con topic unico por llamada para que StrictMode no colisione
  consigo mismo. Nunca se abre canal sin userId. El aviso NO trae el cambio: se
  vuelve a consultar, y esa consulta pasa por la RLS.
  REGLA QUE NO SE DEBE DESHACER: una recarga disparada desde fuera NO declara
  espera, pero SI la apaga. Se quita el setLoading(true) del camino silencioso y
  se conservan TODOS los setLoading(false) —al reves, la guarda loadId deja el
  indicador encendido para siempre—. Vale para ClassroomsProvider y para
  useMissionAssignments, y hay un test por hook que falla al revertirlo.
  LIMITE MEDIDO: los delete de postgres_changes no los filtra la RLS y llegan a
  todo suscriptor de la tabla, con la clave primaria como maximo; la clave
  anonima recibe el sobre vacio, sin una sola columna. No se corrige con
  replica identity full. La salida, si algun dia importa, es
  realtime.broadcast_changes() desde disparadores.
  `npm run build`, `npm run lint` y `npm run test:run` pasan (97 tests).

  STACK
  React 18.3 + TypeScript 5.9 (estricto) + Vite 5.4 + Tailwind 3.4.
  react-router-dom 6.30, @supabase/supabase-js 2.112, zod 3.25.
  Juego 3D: three 0.170 + @react-three/fiber 8.18 + @react-three/drei 9.122,
  con @types/three 0.170
  (three no publica tipos propios y sin ellos el tsc del build falla). Fiber se
  queda en la rama 8 porque la 9 exige React >= 19. Y three esta FIJADO a 0.170
  por el runtime, no por gusto: con fiber 8.18 contra three 0.185 el lienzo se
  crea, el contexto WebGL vive y la escena sale VACIA, con un unico aviso de
  THREE.Clock deprecado como indicio. Tiene que haber UNA sola copia de three en
  node_modules; si queda una izada en la raiz y otra en apps/web, los instanceof
  de fiber dejan de cuadrar. Se arregla restaurando package-lock.json y
  reinstalando, NUNCA regenerandolo: regenerar el lockfile en Windows se lleva
  por delante los binarios opcionales de otras plataformas (@supabase/cli-linux-*)
  y el CI corre npm ci sobre ubuntu-latest. drei entro en el J6.3 y SOLO por
  OrbitControls (girar y acercar el mapa); su rama 9 es la que acompana a fiber
  8. Sumo 16,74 kB al trozo de la escena y cero al principal.
  Bloques: blockly 12.5.1, y se importa blockly/core y NO blockly (el entry
  principal arrastra la biblioteca de bloques estandar y el generador de
  JavaScript, y aqui no se usa ninguno). Blockly trae sus propios tipos por el
  mapa de exports, asi que NO hace falta @types/blockly, que ademas no existe.
  Esta FIJADO a la rama 12 por el instalador: la 13 declara jsdom >=27.4.0
  <30.0.0 como peer dependency y el repo va con jsdom 30.0.1 para Vitest, asi
  que npm install blockly muere con ERESOLVE. Subirlo obliga a mover antes el
  entorno de los tests. La 12 se trae jsdom 26.1.0 como dependencia suya: son 77
  paquetes en node_modules y cero peso en el navegador, medido.
  El juego se carga en DIFERIDO desde el J1, y hay DOS fronteras desde el J4:
  src/game/GameSceneLoader.tsx aisla el motor 3D y src/game/BlockEditorLoader.tsx
  aisla Blockly (las dos son React.lazy + Suspense). Blockly NO cuelga de la
  frontera del motor porque no es 3D: colgarlo meteria un componente de DOM
  dentro de un arbol de fiber. La regla es una: NADA POR ENCIMA DE UNA FRONTERA
  importa lo que esa frontera aisla —ni los cargadores, ni la pantalla del
  laboratorio—. Debajo si: GameScene.tsx importa three, BlockEditor.tsx importa
  blockly. Juntarlos anula la separacion.
  Hay ademas modulos PUROS en src/game/ —level.ts, debugLevel.ts, movement.ts,
  program.ts, blockTypes.ts, interpreter.ts y levelConfig.ts— que no arrastran
  three ni blockly. Casi todos se importan solo desde el lado perezoso, e
  importarlos desde arriba los mete en el trozo principal. levelConfig.ts es la
  EXCEPCION DELIBERADA del J7.1: la pantalla de nivel lo llama POR ENCIMA de las
  fronteras, porque el contrato §7 manda avisar al anfitrion y porque asi un
  nivel ilegible no descarga el motor 3D. El interprete (J5) es el que conoce la forma que
  serializa Blockly; program.ts se niega a conocerla a proposito, y por eso los
  nombres de los bloques viven en blockTypes.ts y no en blocks.ts, que importa
  Blockly. Desde el J5 el sobre y esos nombres los usan los DOS trozos perezosos,
  asi que Vite los saca a un cuarto trozo compartido.
  ESLint 8.57 (config heredada) + Prettier 3.9. Node >= 18.18.
  Tests: Vitest 3.2 + jsdom + Testing Library. Los tests se colocan junto al
  archivo que prueban; src/test/ guarda el setup y el helper renderClassrooms.
  CI: GitHub Actions en .github/workflows/ci.yml ejecuta lint, test:run y
  build en cada push a main y en cada pull request contra main, sobre
  ubuntu-latest con Node fijado a 22.17.1 e instalación con npm ci. Al build
  se le pasan los valores de relleno de apps/web/.env.example, porque .env no
  está en el repositorio. El workflow no despliega nada.

  ESTRUCTURA (monorepo con npm workspaces, node_modules compartido en la raíz)
  apps/web/        front-end, workspace @codeplay/web. El juego vive DENTRO,
                   en src/game/ (decidido el 4-sep-2026, ver
                   docs/DISENO-DEL-JUEGO.md §6). public/models/ guarda los
                   482 modelos .glb de Kenney (5,96 MB, CC0) con su README;
                   van en public/ porque GLTFLoader los pide por URL
  apps/game/       NO EXISTE y ya no existirá: no hay Unity
  packages/        código compartido — vacío
  supabase/        migrations/ (29 migraciones SQL; el seed vive en la 0012,
                   y los niveles del juego de bloques desde la 0023)
  docs/            CONTEXT.md (estado y prioridades), ESTADO-DEL-PROYECTO.md,
                   ROADMAP.md, ROADMAP-JUEGO.md (el orden del juego),
                   CONTRATO-DE-INTEGRACION.md (el contrato del juego) y
                   DISENO-DEL-JUEGO.md (qué es el juego y cómo se puntúa)
  openspec/        specs y changes
  .github/         workflows de GitHub Actions (sólo ci.yml)

  Dentro de apps/web/src: components/ (dashboard/{teacher,student,shared},
  decor, home, auth, ui), context/, hooks/, services/, types/, router/, pages/,
  constants/, config/, lib/, errors/, y game/ a partir del J1 del juego.

  CONVENCIONES OBLIGATORIAS
  - Idioma: código en inglés (identificadores, tipos, archivos). Comentarios,
    documentación e interfaz en español.
  - Comentarios: explican POR QUÉ, nunca QUÉ. El repo es parco en ellos a
    propósito; no añadir comentarios redundantes.
  - Componentes: `export const Foo = () => {}`, nunca export default. Props
    tipadas con interface o type justo encima del componente.
  - Servicios: todos devuelven `{ data, error }` con AppError. Nunca lanzan.
  - Estilos: Tailwind con los nombres de color del tema, nunca hex sueltos. Los
    tokens están duplicados a propósito en src/main.css (variables CSS) y en
    tailwind.config.js. Las clases .btn/.card/.chip/.field viven en main.css.
  - Adornos SVG en components/decor/, con aria-hidden y sin capturar el puntero.
  - Los huecos de la mascota (.mascot-slot, ImagePlaceholder) se dejan VACÍOS a
    propósito hasta que existan las ilustraciones definitivas.
  - El formato del juego lo fija el contrato, no el código: `config` y el sobre
    `{ formatVersion, workspace }` del programa estan escritos campo por campo en
    docs/CONTRATO-DE-INTEGRACION.md §4, decididos en el J3. game/level.ts declara
    ESE MISMO OBJETO sin traducirlo —`config` viaja entero en un solo hueco jsonb,
    a diferencia de las filas, que tienen mapLevelRow—. No inventar una segunda
    forma ni un traductor; en la frontera lo que hace falta es validar.
  - Store de salones: ninguna vista habla con Supabase ni con el almacenamiento
    del navegador, todo pasa por useClassrooms(). ClassroomsProvider fue el
    único archivo que cambió de raíz al conectar la base. No romper esa
    frontera.
  - Cuando una accion sobre salones falle, el motivo se MUESTRA en la pantalla
    desde la que se intento (shared/StoreErrorNotice.tsx), no basta con dejarlo
    en el estado. Y los mensajes que levanta la base vienen en ingles: se
    traducen por codigo en el servicio, que la interfaz es en español.
  - Nunca .single() sobre join_requests: el historial se acumula en filas y un
    niño que reintenta tiene varias. Ordenar por requested_at, limit(1) y
    maybeSingle().
  - class_memberships.student_id y join_requests.student_id NO tienen default
    auth.uid(): hay que enviarlos explícitamente o la política responde 42501,
    que se diagnostica mal.
  - Variables de entorno: config/env.ts valida con zod y LANZA al importarse.
    Sin VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY válidas la app no arranca.
  - El destino tras autenticarse lo decide el rol del PERFIL, nunca el
    formulario ni el botón pulsado. Lo resuelve una única función,
    resolveLandingRoute() en context/auth.helpers.ts, y la llaman TRES:
    PublicRoute, AuthCallback y hooks/useRoleHomeRedirect.ts (que usan Login,
    Signup, Navbar y ResetPassword). No duplicar esa lógica en una pantalla
    nueva.
    OJO, ESTO DECIA ANTES QUE EL HOOK ERA EL UNICO QUE DECIDIA, Y ERA FALSO
    desde antes del enlace de invitacion: PublicRoute tambien decide, y EL HOOK
    NO GANA NUNCA. useActiveRole devuelve user?.role, asi que el rol llega en el
    mismo render que el usuario y la guarda —el padre— devuelve <Navigate> sin
    llegar a renderizar al hijo, de modo que el efecto del hook no corre porque
    el hook no existe. No se notaba porque los tres calculaban el mismo destino.
    MEDIDO EN LAS DOS MITADES, no razonado. (a) Inicio de sesion: fijado en
    router/PublicRoute.test.tsx —quien redirige es la guarda, y la pantalla que
    monta el hook no llega a montarse—. (b) REGISTRO, que es el unico caso donde
    el hook podria ganar porque la sesion llega antes que el perfil y durante esa
    ventana user?.role es nulo y la guarda no aparta: se instrumentaron las dos
    vias con un log temporal y un alta real desde un enlace de invitacion, y solo
    registro PublicRoute, dos veces por StrictMode. El hook no navego ni una vez:
    cuando el perfil aterriza, sesion y rol estan listos en el mismo render y la
    guarda sustituye al hijo antes de que el efecto corra.
    CONSECUENCIA QUE HAY QUE LEER ANTES DE BORRAR NADA: la llamada del hook a
    resolveLandingRoute() es alcanzable SOLO por /reset-password, que va detras
    de PrivateRoute y donde PublicRoute no interviene. PARECE CODIGO MUERTO Y NO
    LO ES: sin ella, quien abre el enlace del correo con una invitacion pendiente
    aterriza en su panel y el token se queda vivo en localStorage para la
    siguiente persona que use ese navegador.
  - Sólo la ausencia de perfil (código PROFILE_NOT_FOUND de profile.service.ts)
    cierra la sesión. Cualquier otro fallo al cargarlo la deja abierta: un corte
    de red no dice nada sobre si la cuenta tiene perfil.
  - PrivateRoute y PublicRoute se ajustan A LA VEZ. La primera manda a /login a
    quien tenga sesión y no tenga rol; si la segunda apartara a todo el que tiene
    sesión lo devolvería a getHomeRouteForRole(null), que es /dashboard/worlds, y
    se cierra un bucle. Por eso PublicRoute exige sesión Y rol.
    Y NO son simetricas en lo que deciden: PrivateRoute NO decide destino, solo
    corta —manda a /login a quien no puede pasar—; la que elige a donde va
    alguien recien autenticado es PublicRoute, y por eso el resolutor de
    aterrizaje se llama desde ella y no desde su pareja.
  - La ruta de vuelta de OAuth, /auth/callback, NO lleva guarda, y es la unica
    del proyecto asi. Resuelve cuatro estados: error del proveedor (lo muestra),
    sin sesion (a /login), rol bloqueado (aviso neutro) y rol por fijar. Una
    guarda solo sabe que no hay sesion, y con ese dato no distingue "el proveedor
    fallo" de "alguien escribio la direccion": redirigir en el primero descarta el
    fragmento donde viaja el motivo. PrivateRoute y PublicRoute no se tocaron.
  - La intencion de rol para OAuth vive en context/oauthRole.helpers.ts, con el
    patron de guest.helpers.ts, y SU FUNCION DE LECTURA BORRA en la misma llamada:
    con get + clear separados, un camino que devuelva antes de la segunda deja una
    intencion viva que se aplicaria al viaje siguiente, que en un aula puede ser el
    de otra persona.
    EL TOKEN DE INVITACION SIGUE ESE PATRON PERO CON UN MATIZ QUE HAY QUE LEER
    ANTES DE «ARREGLAR» NADA. context/invitationToken.helpers.ts expone DOS
    lecturas y los nombres mandan: takePendingInvitationToken() borra —la usa
    pages/Invite y nadie mas—, y peekPendingInvitationToken() NO borra —la usa
    resolveLandingRoute()—. La pura no es un descuido: PublicRoute decide
    durante el RENDER, que StrictMode invoca dos veces, y borrar ahi es una
    escritura en un camino que se ejecuta dos veces; medido, la primera pasada
    gastaba el token y la segunda ya no lo encontraba, asi que el token se
    consumia Y la persona acababa en su panel.
    Lo que el patron de oauthRole prohibe es repartir el get y el clear entre
    caminos que pueden volver antes del segundo. Aqui no ocurre: el borrado
    tiene UN DUEÑO UNICO, pages/Invite, que ademas es el UNICO DESTINO al que
    ese token puede llevar, asi que no hay camino que se lo salte. Consume quien
    llega, no quien decide. Al montar con sesion borra INCONDICIONALMENTE, no
    solo el token que coincide con la URL: quien llega puede arrastrar el de un
    rodeo abandonado, y el condicional dejaria vivo el viejo. Fijado en
    pages/Invite/Invite.test.tsx con los tres casos.
  - La RPC del rol se llama SIEMPRE que hay intencion, coincida o no con el rol
    actual. "Hace falta escribir" no es "el rol difiere" sino "hay intencion y el
    rol aun no esta declarado", y ese segundo dato solo lo tiene el servidor. El
    disparador crea todo perfil de Google como child, asi que condicionar por la
    diferencia dejaba sin marcar a quien se registraba eligiendo Nino.
  - Supabase ENLAZA IDENTIDADES por correo verificado: entrar con Google con un
    correo que ya tiene cuenta no crea usuario, le anade el proveedor, y el
    disparador no corre. De ahi cuelga toda la regla del rol.
  - signUp() con un correo ya registrado responde 422 user_already_exists, NO la
    senal documentada del user con identities vacio: esa es la de cuando la
    confirmacion por correo esta encendida, y aqui esta apagada. No toca la cuenta
    existente, ni siquiera una que solo tenga Google y ninguna contrasena.
  - El aviso de "esa cuenta ya existe" del formulario es GENERICO y no nombra el
    rol: ahi no hay sesion, y nombrarlo diria a un desconocido si detras del correo
    hay un nino o un tutor. En la vuelta de OAuth si se nombra, porque es su propia
    sesion. La asimetria la impone la tecnologia, no el gusto.
  - /reset-password va tras PrivateRoute SIN prop role, y ese es el motivo de que
    la prop sea opcional: el enlace del correo abre una sesión real, así que
    PublicRoute apartaría a esa persona a su panel y la pantalla no se vería
    nunca, y declarar un rol rebotaría a la mitad de la gente al panel del otro.
    No es código muerto que limpiar.
  - El loading global de AuthProvider significa «la sesión se está resolviendo»,
    y las guardas responden a él cambiando su subárbol entero por un spinner. Se
    levanta SÓLO cuando cambia el id del usuario (null→id, id→null, id→otro), no
    en cada evento de onAuthStateChange: un refresco de token desmontaría
    formularios a medias. Por lo mismo, ClassroomsProvider depende de userId y
    userRole, nunca del objeto user, que se reconstruye en cada evento. Una
    acción que ocurre dentro de una sesión ya resuelta —cambiar la contraseña,
    por ejemplo— lleva su propio indicador de envío en su pantalla.
  - Cambiar la contraseña desde Ajustes pide la ACTUAL y la verifica contra el
    servidor con signInWithPassword antes de updateUser, que no la exige: son
    computadores de aula compartidos y el correo de recuperación es justo lo que
    un niño puede no controlar. Esa llamada vive en el servicio y no pasa por el
    signIn del contexto, que mueve loading y error globales.
  - «Secure password change» está ENCENDIDO en el panel de Supabase y la
    aplicación no necesita nada para convivir con él. Comprobados los dos
    caminos: el de Ajustes, que reautentica, y /reset-password, que NO lo hace y
    trabaja sobre la sesión del enlace del correo. Al servidor le bastan las dos
    sesiones —las considera recientes— y no pide nonce por correo. Lo que lo
    satisface es esa frescura, así que un cambio de contraseña hecho desde una
    sesión vieja podría toparse con la exigencia del nonce, y su mensaje llega
    en inglés: se traduciría en el servicio, o se apaga el interruptor. El
    correo de fábrica no da para un envío en cada cambio.

  COMANDOS (desde la raíz)
  npm run dev | build | lint | test | test:run | preview | format
  Para un workspace: npm run <script> -w @codeplay/web

  PRIORIDADES DEL HITO ACTUAL
  Funcionalidades completas de punta a punta, en este orden:
  1. Base de datos real en Supabase: HECHO. El esquema entero está aplicado,
     salones incluidos.
  2. Mover el store de salones de localStorage a Supabase: HECHO (paso 10).
  3. Auth y roles funcionales verificados en servidor: HECHO (paso 12), con las
     contraseñas cerradas en el paso 13 y GOOGLE OAUTH en el paso 15, los tres
     verificados contra la base real. Fuera queda solo retirar la sesion de
     invitado (paso 24, despues del juego).
  4. Apartado web de integración de los niveles del juego: LA PANTALLA DE NIVEL
     YA EXISTE, hecha en el J7.1 —ruta /dashboard/worlds/:worldId/:levelId, la
     lista de niveles leyendo de la base y el juego montado dentro—. Los tres
     niveles del mundo 1 y los tres del mundo 2 se juegan desde su fila (J7 y
     J12.1 a J12.3 cerrados). Y EL MUNDO 3 TAMBIEN, desde el 17-sep-2026:
     dos-caminos y el-faro por la 0030 (mundo-3-niveles-1-y-2) y muchos-caminos
     por la 0031, retocada por la 0032 (mundo-3-nivel-3). LOS NUEVE NIVELES SE
     JUEGAN DESDE SU FILA, asi que el J12 esta cerrado y el J13 —la pasada de
     graficos— ya no esta bloqueado. Los tres del mundo 3 llevan stepLimit igual
     a optimalSteps. LA DIFICULTAD DEL MUNDO 3 SE MIDE EN CAMINOS Y NO EN PASOS,
     decidido por el usuario: mas caminos OPTIMOS es mas perdonar, y un unico
     camino correcto tampoco es dificil si es recto y los demas son curvos. Lo
     que se busca es que los caminos que valen no se distingan a ojo de los que
     no. Ver docs/CONTEXT.md 4.2b antes de retocar ningun nivel de ese mundo.
     EL MUNDO 3 SE JUEGA CONTRA UN MAXIMO DE PASOS, mecanica construida por
     limite-de-pasos (J12.4): config gana stepLimit, OPCIONAL —ausente es sin
     limite, que es como se juegan los seis ya sembrados—; al agotarlo runProgram
     corta el recorrido y Run lo marca con outOfSteps; un salto es atomico, asi
     que con un solo paso de sobra no se ejecuta; cortar NO es Detener y no se
     reanuda; y el contador se da la vuelta a "Pasos restantes: N", que contradice
     a proposito la regla de no anunciar lo que falta porque ahi el nivel ya es un
     problema de optimizacion. Un stepLimit por debajo de optimalSteps rechaza el
     nivel entero. El XP del mundo 3 lo escribio el J10, y NO es "pasar se lleva
     el entero" como se penso: el recuento es del programa leido y el corte del
     limite llega despues de pisar la meta, asi que pasar dejando bloques detras
     cuenta esos pasos y puntua menos (medido: 15 pasos y 93 en muchos-caminos,
     de optimo y limite 14).
     EL TABLERO TIENE ALTURAS Y HAY UN BLOQUE CON CUERPO desde salto-y-alturas:
     config gana heights (hueco 0, lo demas 1 o mas), el bloque saltar ejecuta
     saltando lo que lleva dentro y cuesta el doble de su cuerpo (vacio, 1), y la
     unica version del formato es grid-blockly-2. Ver
     docs/CONTRATO-DE-INTEGRACION.md 3, 4.2, 4.3 y 4.4. La lista
     NO bloquea ningun nivel hasta la prueba preliminar, decidido por el
     usuario: el candado se decide despues (docs/CONTEXT.md 4.11).
     EL RESULTADO YA SE ESCRIBE, desde el 17-sep-2026 (J9, mandar-el-intento):
     cada partida terminada guarda intento y progreso por
     components/dashboard/student/submitAttempt.ts, con el programa entero en su
     sobre, la duracion y las observaciones. FALLAR TAMBIEN ESCRIBE PROGRESO,
     in_progress, decidido por el usuario; superar escribe completed. Por eso el
     contador de mundos pasa a exigir completion_status completed (deuda 4.12,
     resuelta ahi).
     Y SE PUNTUA Y SE CONCEDE XP POR MARCA DE AGUA, desde el mismo dia (J10,
     migracion-del-xp, migracion 202606030033): eran dos llamadas y ahora es UNA,
     submit_level_attempt, porque la puntuacion sale de contar el programa y
     upsert_my_progress no lo recibe; con eso attempt_count cuenta partidas y
     coincide con las filas de level_attempts. La puntuacion la calcula la base
     leyendo el programa —count_program_steps sobre el jsonb del sobre— con la
     regla redondeo(100 x optimalSteps / pasos), suelo de uno para que resolver
     siempre pague algo y CERO si la partida no tuvo exito o el programa no se
     puede leer. El XP concedido es (marca nueva - marca anterior) x xp_reward /
     100, asi que superar flojo paga la partida, mejorar paga la diferencia y
     empeorar paga cero. El cliente calcula la MISMA puntuacion en
     game/score.ts para enseñarla sin esperar al servidor y la guarda en
     metadata al lado de la del servidor, para poder cotejarlas. La ventana de
     nivel superado enseña puntuacion y XP concedida, no la xp_reward de la fila.
     LA BARRA YA MARCA TRAMOS, desde el mismo dia (J11, nivel-explorador, sin
     migracion): 300 XP por tramo —lo que da un mundo entero perfecto— y el
     numero que sube al llenarlo se llama NIVEL EXPLORADOR, decidido por el
     usuario para no chocar con los niveles del juego; empieza en 1 con cero XP.
     Las tres cuentas viven en constants/progress.ts y XPBar recibe solo el XP,
     asi que ninguna llamada puede pintar un tramo distinto. La barra NO lleva
     techo a proposito: los logros del paso 22 podran repartir XP sin tocarla.
     El nino lo ve en la barra lateral, la superior y Ajustes; el tutor ve ademas
     el XP acumulado en su tabla, porque la barra sola ordena mal —se vacia al
     subir—. Y el XP SE REFRESCA SIN RECARGAR: AuthProvider.applyTotalXp aplica
     el total que devuelve submit_level_attempt, que antes no lo aplicaba nadie
     —medido: la base en 693 y la pantalla en 683—. La ventana de nivel superado
     celebra la subida de tramo cuando ocurre.
  El apartado gráfico queda FUERA de este hito a propósito.

  DEUDA TÉCNICA QUE CONDICIONA EL DISEÑO
  - types/database.types.ts se GENERA con la CLI y nunca se edita a mano:
    `npx supabase gen types typescript --linked`. Describe el esquema real.
  - El progreso NO conoce los salones: ninguna tabla de progreso referencia a
    uno. Por eso la tabla de seguimiento del tutor muestra «Sin actividad» y los
    reportes de habilidades 0 %. Conectarlo es el paso 17, y tiene arista de
    privacidad.
  - Las lecturas que cruzan pertenencias se conceden por VISTA con el filtro
    dentro, nunca ampliando políticas: una política que consulta la tabla que
    protege recursa, y eso aparece antes al escribir que al leer.
  - Las credenciales de prueba (VITE_DEV_*) NO van en config/env.ts: ese módulo
    valida al importarse y se ejecuta también en producción. Se leen tras
    import.meta.env.DEV y como accesos de miembro, nunca copiando
    import.meta.env.
  - Cuando una política de RLS consulte otra tabla, el análisis de ciclos se
    hace desde cada ESCRITURA, no sólo desde las lecturas: así se coló la
    recursión que arregló la migración 0014.
  - No existe catálogo de logros: la tabla achievements registra los concedidos
    a cada niño, no los posibles. La sala de trofeos sólo lista lo conseguido.
  - EL ROL DEL REGISTRO LO ELIGE EL NAVEGADOR y es una decisión tomada, no un
    descuido: el disparador lo lee de los metadatos del alta, así que cualquiera
    puede darse de alta como tutor con la clave anónima. Está acotado —un valor
    que no sea child ni tutor se degrada a child sin abortar el alta— y cerrarlo
    exige que el rol lo conceda el servidor por una vía que el navegador no
    controle (código de institución canjeado por una RPC security definer). Se
    queda así mientras no haya usuarios reales. Ver docs/CONTEXT.md §2.2.
    OJO: el paso 15 cerro CAMBIAR de rol, no REGISTRARSE como tutor de entrada.
    Son dos agujeros distintos y solo el primero esta cerrado.
  - NINGUNA tabla guarda el correo de alguien que no tiene cuenta. invitations
    lo hacía y la migración 0016 lo eliminó: era el dato de un tercero que nadie
    había autorizado, que nada borraba y cuya finalidad —el envío, que es el
    paso 19— no se ejecuta. Si un cambio necesita el correo de un tercero, esa
    es una decisión que se toma explícitamente, no una columna que se rellena.
  - Conservación: los datos personales viven mientras exista la cuenta y se van
    con ella por las cascadas contra auth.users de las migraciones 0002, 0004,
    0005 y 0013. Las invitaciones se purgan además a los 14 días por expires_at,
    obligación que hereda el paso 19 porque hoy no se escribe ninguna fila.
  - Toda migración nueva debe traer sus políticas de RLS y sus grant: el
    proyecto se creó con RLS automática y sin exposición automática de tablas.
    Y revocar de public no basta: hay que revocar de anon aparte.
  - pgcrypto está instalada con schema extensions: sus funciones se llaman
    calificadas (extensions.gen_random_bytes), o el db push muere con 42883.
  - La landing viva es components/home/, montada desde pages/Home/HomePage.tsx.

  DOCUMENTOS DE REFERENCIA
  - docs/CONTEXT.md: estado detallado, decisiones de diseño y prioridades.
  - docs/ESTADO-DEL-PROYECTO.md §2: guía de estilos completa (paleta,
    tipografía, componentes, espaciado). Consultarla antes de tocar UI.
  - supabase/README.md: detalle migración por migración.
  - docs/DISENO-DEL-JUEGO.md: qué es el juego, qué cuenta como un paso y
    cómo se puntúa. Fuente de verdad del diseño desde el 3-sep-2026.
  - docs/ROADMAP-JUEGO.md: en qué orden se construye el juego, en cuatro
    fases. El backend entra tarde a propósito.
  - docs/CONTRATO-DE-INTEGRACION.md: qué manda y qué recibe el juego. Es el
    único documento escrito para quien NO conoce el repositorio, así que no
    debe ganar referencias a sus secciones ni a sus nombres de código.
    Decidido en el paso 23.1: el juego no nombra logros ni misiones, el
    servidor concede leyendo el programa enviado, y ese programa debe
    serializarse en JSON.

# Reglas por artefacto.
rules:
  proposal:
    - Redacta la prosa en español, como el resto de la documentación del repo.
    - Nombra rutas de archivo reales y verificadas del repo en la sección Impact.
    - 'Di explícitamente si el cambio depende del proyecto de Supabase: hoy ya
      está enlazado y con el esquema aplicado, así que lo que queda por decir es
      si el cambio necesita un db push, que sólo puede lanzar el usuario porque
      pide credenciales por consola.'
  specs:
    - 'Los identificadores de OpenSpec van en inglés: los encabezados
      "### Requirement:" y "#### Scenario:", y las palabras clave SHALL, WHEN y
      THEN. El texto del requisito y del escenario va en español.'
    - 'Usa los nombres de dominio tal y como están en el código: child, tutor,
      membership (none/pending/member), ClassGroup, JoinRequest.'
  tasks:
    - Agrupa las tareas por archivo o por capa, no por orden cronológico suelto.
    - 'Incluye siempre una tarea final de verificación con npm run lint y
      npm run build: ambos pasan hoy y no deben romperse.'
  design:
    - Justifica las decisiones que afecten a la frontera del store de salones o
      al esquema de base de datos; son las dos más caras de revertir.

# Guía por operación.
operations:
  apply:
    guidance:
      - Ejecuta npm run lint, npm run test:run y npm run build antes de dar
        por terminado.
      - Si el cambio toca UI, respeta los tokens del sistema visual en vez de
        introducir colores o tamaños nuevos.
  archive:
    guidance:
      - 'Al archivar, actualiza docs/CONTEXT.md según el tipo de cambio. Si
        afecta a una capacidad del producto: mueve la entrada de "por aplicar"
        a "aplicadas" con la ruta real de los archivos. Si es herramienta,
        documentación o limpieza: NO va en esa lista, porque no sale de las
        prioridades P1-P6; propaga lo que corresponda al stack o a las
        convenciones de la sección 1, y replícalo en este archivo.'
